apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: proctoring-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: proctoring-platform/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_HOST
              value: eureka-server
            - name: CONFIG_SERVER_HOST
              value: config-server
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 1, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: proctoring-platform
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# Adjust host/annotations for your ingress controller (this assumes ingress-nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: proctoring-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: proctoring-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
