# Placeholder credentials for local/dev clusters (kind, minikube, k3d). Replace with a real
# secret manager integration (Sealed Secrets, External Secrets Operator, cloud KMS, etc.)
# before this touches anything with real candidate data — this file should never be committed
# with real values, and ideally isn't committed at all in a real deployment.
apiVersion: v1
